<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A card shared with you — Handleshare</title>
<meta name="robots" content="noindex">
<!-- Static fallback for link previews. Per-link og tags (name, photo) come
     from the /v/<id> worker route; this covers direct view.html links, whose
     #hash never reaches a server. -->
<meta property="og:title" content="A card shared with you">
<meta property="og:description" content="A Handleshare card with files you can download — the link expires on its own.">
<meta property="og:image" content="https://handleshare.com/logo.png">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --ink:#ffffff;
    --muted:rgba(255,255,255,.52);
    --muted2:rgba(255,255,255,.74);
    --canvas:#0d0020;
    --violet:#7100BA;
    --magenta:#C21FD4;
    --glow:#9D47D5;
    --surface:rgba(255,255,255,.055);
    --surface2:rgba(255,255,255,.09);
    --line:rgba(255,255,255,.1);
    /* Pure white at 10%: a tinted outline picks up the canvas and reads as dirt. */
    --outline:oklch(1 0 0 / 0.1);
    /* Two layers: contact + ambient. One big blur reads as a smudge. */
    --lift:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -12px rgba(0,0,0,.55);
    --ease:cubic-bezier(0.2,0,0,1);
  }
  *{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{
    margin:0;background:var(--canvas);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    line-height:1.55;
    background-image:radial-gradient(58% 30% at 50% 0%,rgba(113,0,186,.26),transparent 72%);
    background-repeat:no-repeat;
  }
  img{max-width:100%}
  :focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:8px}
  .wrap{max-width:880px;margin:0 auto;padding:28px 20px 96px}

  nav{font-size:15px;margin-bottom:28px}
  nav a{color:var(--muted2);text-decoration:none;display:inline-flex;align-items:center;gap:9px;
    min-height:44px;border-radius:12px;
    transition-property:color;transition-duration:140ms;transition-timing-function:var(--ease)}
  nav a:hover{color:var(--ink)}
  nav img{width:26px;height:26px;border-radius:7px;outline:1px solid var(--outline);outline-offset:-1px}

  /* who it's from */
  .card{display:flex;gap:16px;align-items:flex-start;padding:20px;
    /* Outer 20 = inner 12 + 8 padding, so the corners stay concentric. */
    border-radius:20px;background:var(--surface);box-shadow:var(--lift);margin-bottom:28px}
  .avatar{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;
    background:linear-gradient(150deg,var(--violet),var(--magenta));
    display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;
    outline:1px solid var(--outline);outline-offset:-1px}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  h1{font-size:25px;line-height:1.22;font-weight:600;margin:2px 0 2px;text-wrap:balance}
  .role{color:var(--muted2);font-size:15px;margin:0;text-wrap:pretty}
  .note{margin:10px 0 0;color:var(--muted2);font-size:15px;white-space:pre-line;overflow-wrap:anywhere;text-wrap:pretty}

  .actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px}
  .btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:15px;
    min-height:44px;padding:0 20px;border-radius:14px;display:inline-flex;align-items:center;gap:9px;
    color:var(--ink);background:var(--surface2);text-decoration:none;
    transition-property:background-color,scale;transition-duration:140ms;transition-timing-function:var(--ease)}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn:active{scale:0.96}
  .btn.primary{background:linear-gradient(150deg,var(--violet),var(--magenta));box-shadow:var(--lift)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn[disabled]{opacity:.55;cursor:default;scale:1}

  .count{color:var(--muted);font-size:14px;margin:0 0 14px;font-variant-numeric:tabular-nums}

  /* the files */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .tile{display:flex;flex-direction:column;border-radius:24px;overflow:hidden;
    background:var(--surface);box-shadow:var(--lift)}
  .thumb{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.04);position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;
    outline:1px solid var(--outline);outline-offset:-1px}
  .glyph{font-size:38px;line-height:1}
  /* PDF first page, drawn by pdf.js once the tile scrolls into view */
  .thumb .page{position:absolute;inset:0;object-position:top center;background:#fff;
    opacity:0;transition-property:opacity;transition-duration:200ms;transition-timing-function:ease-out}
  .thumb .page.ready{opacity:1}
  .thumb .page.ready ~ .ext{color:#fff;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:6px}
  .ext{position:absolute;bottom:8px;right:10px;font-size:11px;font-weight:700;letter-spacing:.08em;
    color:var(--muted2)}
  .name{flex:1 0 auto;padding:12px 12px 0;font-size:14px;font-weight:600;overflow-wrap:anywhere;text-wrap:pretty}
  .size{padding:2px 12px 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tile .btn{margin:12px;justify-content:center;border-radius:12px;font-size:14px}

  .state{padding:64px 0;text-align:center;color:var(--muted2);font-size:17px;text-wrap:balance}
  .state strong{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}

  footer{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);
    color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
  footer a{color:var(--muted2);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;
    transition-property:color;transition-duration:140ms;transition-timing-function:var(--ease)}
  footer a:hover{color:var(--ink)}
  .spacer{flex:1}

  /* contact card sheet */
  .sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet[hidden]{display:none}
  .scrim{position:absolute;inset:0;background:rgba(6,0,16,.62);opacity:0;
    transition-property:opacity;transition-duration:200ms;transition-timing-function:ease-out}
  .panel{position:relative;width:100%;max-width:440px;max-height:92vh;overflow:auto;
    background:#170830;border-radius:28px 28px 0 0;box-shadow:var(--lift);
    padding:12px 12px calc(16px + env(safe-area-inset-bottom));
    opacity:0;transform:translateY(12px);
    transition-property:opacity,transform;transition-duration:200ms,240ms;transition-timing-function:ease-out,var(--ease)}
  .sheet.open .scrim{opacity:1}
  .sheet.open .panel{opacity:1;transform:none}
  @media (min-width:600px){
    .sheet{align-items:center;padding:24px}
    .panel{border-radius:28px;padding-bottom:16px}
  }
  /* Outer 28 = inner 16 + 12 padding. */
  .cc-head{position:relative;border-radius:16px;padding:28px 20px 22px;text-align:center;
    background:linear-gradient(150deg,rgba(113,0,186,.55),rgba(194,31,212,.35))}
  .cc-head .avatar{width:96px;height:96px;margin:0 auto 14px;font-size:34px}
  .cc-head h2{font-size:23px;line-height:1.22;font-weight:600;margin:0;text-wrap:balance}
  .cc-head p{margin:4px 0 0;color:var(--muted2);font-size:15px;text-wrap:pretty}
  .close{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:22px;
    background:transparent;color:var(--muted2);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition-property:background-color,color;transition-duration:140ms;transition-timing-function:var(--ease)}
  .close:hover{background:rgba(255,255,255,.1);color:var(--ink)}
  .cc-rows{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
  .cc-row{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 12px;border-radius:16px;
    color:var(--ink);text-decoration:none;
    transition-property:background-color;transition-duration:140ms;transition-timing-function:var(--ease)}
  .cc-row:hover{background:var(--surface2)}
  .cc-ic{flex:none;width:36px;height:36px;border-radius:18px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;color:var(--glow)}
  .cc-ic svg{width:18px;height:18px}
  .cc-txt{min-width:0;display:flex;flex-direction:column}
  .cc-txt small{font-size:12px;color:var(--muted);line-height:1.3}
  .cc-txt span{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
  .cc-add{width:100%;justify-content:center;margin-top:12px;min-height:50px;border-radius:16px}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:0ms !important}
    .btn:active{scale:1}
  }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="https://handleshare.com/"><img src="logo.png" alt="">Handleshare</a>
  </nav>

  <main id="content">
    <div class="state" id="state">Loading…</div>
  </main>

  <footer>
    <span id="expiry"></span>
    <span class="spacer"></span>
    <a href="mailto:support@handleshare.com?subject=Report%20a%20shared%20Handleshare%20card">Report this card</a>
    <a href="https://handleshare.com/">Get Handleshare</a>
  </footer>
</div>

<script>
(function(){
  'use strict';

  var CONTAINER = 'iCloud.com.fbmore.Handleshare';
  var WORKER = 'https://handleshare-views.fbmore.workers.dev';
  // CloudKit Web Services API tokens: public by design, origin-locked to
  // handleshare.com in CloudKit Console. Production is tried first so a live
  // link never pays for a development round-trip.
  var ENVS = [
    { env: 'production',  token: '6920cd6d47f917091a83eb94ce370b8a5e5aa442be7002a34a4109e31a276cc9' },
    { env: 'development', token: '54f7aa2de5451985754058562e9df62905e37dfe07073312590a56dfc2f67f07' }
  ];

  var content = document.getElementById('content');
  var expiryEl = document.getElementById('expiry');
  var recordName = (location.hash || '').replace(/^#/, '').split('/')[0];

  function state(html){
    content.innerHTML = '<div class="state">' + html + '</div>';
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  }
  function clean(v, max){
    var s = typeof v === 'string' ? v.replace(/\s+/g,' ').trim() : '';
    return max && s.length > max ? s.slice(0, max) : s;
  }
  function bytes(n){
    if(!n && n !== 0) return '';
    if(n < 1000) return n + ' B';
    if(n < 1e6) return Math.round(n / 1000) + ' KB';
    return (Math.round(n / 1e5) / 10) + ' MB';
  }
  function extOf(name){
    var m = /\.([A-Za-z0-9]{1,6})$/.exec(name || '');
    return m ? m[1].toUpperCase() : '';
  }

  if(!/^[A-Za-z0-9-]{10,100}$/.test(recordName)){
    state('<strong>This link is incomplete.</strong>Ask the sender for the full address.');
    return;
  }

  lookup(0);

  function lookup(i){
    if(i >= ENVS.length){
      state('<strong>This link has expired</strong>or the card was taken down.');
      return;
    }
    var e = ENVS[i];
    fetch('https://api.apple-cloudkit.com/database/1/' + CONTAINER + '/' + e.env + '/public/records/lookup?ckAPIToken=' + e.token, {
      method: 'POST',
      body: JSON.stringify({ records: [{ recordName: recordName }] })
    }).then(function(r){ return r.json(); }).then(function(resp){
      var rec = resp.records && resp.records[0];
      if(!rec || rec.serverErrorCode || !rec.fields){ lookup(i + 1); return; }
      // Rendering separately: a bug in render() is not a missing record, and
      // must never be reported to a visitor as an expired link.
      try { render(rec); }
      catch(err){
        console.error('render failed', err);
        state('<strong>Something went wrong showing this card.</strong>Try reloading the page.');
      }
    }).catch(function(){ lookup(i + 1); });
  }

  function render(rec){
    var f = rec.fields || {};
    var expiresAt = f.expiresAt ? new Date(f.expiresAt.value) : null;
    if(expiresAt && expiresAt < new Date()){
      state('<strong>This link has expired.</strong>The files are no longer stored.');
      return;
    }

    var who = clean(f.senderName && f.senderName.value, 60);
    var role = clean(f.senderRole && f.senderRole.value, 90);
    var note = clean(f.message && f.message.value, 600);
    var vcard = (f.vcard && f.vcard.value) || '';
    var photo = (f.senderPhoto && f.senderPhoto.value && f.senderPhoto.value.downloadURL || '').replace('${f}', 'sender.jpg');
    var items = (f.items && f.items.value) || [];
    var names = (f.itemNames && f.itemNames.value) || [];
    var types = (f.itemTypes && f.itemTypes.value) || [];

    var files = items.map(function(it, i){
      var name = clean(names[i]) || ('file-' + (i + 1));
      var type = types[i] || 'file';
      if(['pdf','image','file'].indexOf(type) < 0) type = 'file';
      return {
        name: name,
        type: type,
        size: (it && it.size) || (it && it.value && it.value.size) || 0,
        url: (it.downloadURL || (it.value && it.value.downloadURL) || '').replace('${f}', encodeURIComponent(name))
      };
    }).filter(function(x){ return x.url; });

    document.title = (who ? who + '’s card' : 'A card shared with you') + ' — Handleshare';

    var initials = (who || '?').split(/\s+/).slice(0, 2).map(function(w){ return w.charAt(0); }).join('').toUpperCase();
    var html = '<section class="card">' +
      '<span class="avatar" aria-hidden="true">' + (photo ? '<img src="' + esc(photo) + '" alt="">' : esc(initials)) + '</span>' +
      '<div>' +
        '<h1>' + esc(who || 'A card shared with you') + '</h1>' +
        (role ? '<p class="role">' + esc(role) + '</p>' : '') +
        (note ? '<p class="note">' + esc(note) + '</p>' : '') +
      '</div></section>';

    html += '<div class="actions">';
    if(vcard) html += '<button class="btn primary" id="viewcard" type="button" aria-haspopup="dialog">View contact card</button>';
    if(files.length > 1) html += '<button class="btn" id="all" type="button">Download all (' + files.length + ')</button>';
    html += '</div>';

    if(files.length){
      html += '<p class="count">' + files.length + (files.length === 1 ? ' file' : ' files') + '</p><div class="grid">';
      files.forEach(function(file, i){
        var glyph = file.type === 'pdf' ? '📄' : file.type === 'image' ? '🖼️' : '📎';
        html += '<article class="tile">' +
          '<div class="thumb"' + (file.type === 'pdf' ? ' data-pdf="' + i + '"' : '') + '>' +
            (file.type === 'image'
              ? '<img src="' + esc(file.url) + '" alt="' + esc(file.name) + '" loading="lazy">'
              : '<span class="glyph" aria-hidden="true">' + glyph + '</span><span class="ext">' + esc(extOf(file.name)) + '</span>') +
          '</div>' +
          '<p class="name">' + esc(file.name) + '</p>' +
          (file.size ? '<p class="size">' + bytes(file.size) + '</p>' : '') +
          '<button class="btn" type="button" data-i="' + i + '">Download</button>' +
        '</article>';
      });
      html += '</div>';
    } else {
      html += '<p class="count">This card has no files attached.</p>';
    }

    content.innerHTML = html;

    previewPDFs(files);

    if(expiresAt){
      expiryEl.textContent = 'Link expires ' + expiresAt.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
    }

    var viewcard = document.getElementById('viewcard');
    if(viewcard) viewcard.addEventListener('click', function(){
      openContactCard({ who: who, role: role, photo: photo, initials: initials, vcard: vcard }, viewcard);
    });

    content.addEventListener('click', function(ev){
      var btn = ev.target.closest('button[data-i]');
      if(!btn) return;
      download(files[parseInt(btn.dataset.i, 10)], btn);
    });

    var all = document.getElementById('all');
    if(all) all.addEventListener('click', function(){
      all.disabled = true;
      var label = all.textContent;
      var n = 0;
      (function next(){
        if(n >= files.length){ all.disabled = false; all.textContent = label; return; }
        all.textContent = 'Downloading ' + (n + 1) + ' of ' + files.length + '…';
        download(files[n++]).then(next, next);
      })();
    });

    // View count: a number against a random id. No IP, no cookie, no profile.
    try { fetch(WORKER + '/hit/' + encodeURIComponent(recordName)); } catch(err) {}
  }

  // iCloud's asset CDN sends no CORS header, so a cross-origin fetch needs the
  // worker relay. A direct navigation is the fallback when even that fails.
  function download(file, btn){
    var original = btn && btn.textContent;
    if(btn){ btn.disabled = true; btn.textContent = 'Downloading…'; }
    return fetchBlob(file)
      .then(function(blob){ saveBlob(blob, file.name); })
      .catch(function(){ window.open(file.url, '_blank', 'noopener'); })
      .then(function(){ if(btn){ btn.disabled = false; btn.textContent = original; } });
  }

  function fetchBlob(file){
    if(file.blob) return Promise.resolve(file.blob);
    return fetch(WORKER + '/asset?url=' + encodeURIComponent(file.url))
      .then(function(r){ if(!r.ok) throw new Error('relay ' + r.status); return r.blob(); })
      .then(function(blob){ file.blob = blob; return blob; });
  }

  // First-page previews for PDFs. pdf.js loads only if the card has a PDF,
  // each file only when its tile nears the viewport, and anything that fails
  // (old browser, huge or broken file) just keeps the glyph.
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/';
  var PREVIEW_MAX_BYTES = 25 * 1024 * 1024;
  var pdfjsLoad = null;

  function loadPdfjs(){
    if(!pdfjsLoad){
      pdfjsLoad = import(PDFJS + 'pdf.min.mjs').then(function(lib){
        lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.mjs';
        return lib;
      });
    }
    return pdfjsLoad;
  }

  function previewPDFs(files){
    var thumbs = Array.prototype.slice.call(content.querySelectorAll('.thumb[data-pdf]'))
      .filter(function(el){
        var f = files[parseInt(el.dataset.pdf, 10)];
        return f && (!f.size || f.size <= PREVIEW_MAX_BYTES);
      });
    if(!thumbs.length) return;
    if(!('IntersectionObserver' in window)){ thumbs.forEach(function(el){ renderFirstPage(el, files); }); return; }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting) return;
        io.unobserve(e.target);
        renderFirstPage(e.target, files);
      });
    }, { rootMargin: '300px 0px' });
    thumbs.forEach(function(el){ io.observe(el); });
  }

  function renderFirstPage(thumb, files){
    var file = files[parseInt(thumb.dataset.pdf, 10)];
    var doc = null;
    Promise.all([loadPdfjs(), fetchBlob(file).then(function(b){ return b.arrayBuffer(); })])
      .then(function(r){
        return r[0].getDocument({ data: new Uint8Array(r[1]), isEvalSupported: false }).promise;
      })
      .then(function(d){ doc = d; return d.getPage(1); })
      .then(function(page){
        var base = page.getViewport({ scale: 1 });
        var width = Math.min(thumb.clientWidth * (window.devicePixelRatio || 1), 1200);
        var viewport = page.getViewport({ scale: width / base.width });
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(viewport.width);
        canvas.height = Math.round(viewport.height);
        return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise
          .then(function(){ return new Promise(function(res){ canvas.toBlob(res, 'image/jpeg', 0.85); }); });
      })
      .then(function(jpeg){
        if(!jpeg) return;
        var img = document.createElement('img');
        img.className = 'page';
        img.alt = 'First page of ' + file.name;
        img.onload = function(){ img.classList.add('ready'); };
        img.src = URL.createObjectURL(jpeg);
        thumb.insertBefore(img, thumb.querySelector('.ext'));
      })
      .catch(function(){ /* keep the glyph */ })
      .then(function(){ if(doc) doc.destroy(); });
  }

  // ---- Contact card -------------------------------------------------------
  // Built from the link's vCard, which the app writes with only the fields the
  // sender chose to share. Every value is a real link: tel:, mailto:, the
  // page itself, or a map search for the address.

  var ICONS = {
    phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'
  };
  function icon(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  }

  function parseVCard(text){
    var out = { tels: [], emails: [], urls: [], adr: '' };
    var unesc = function(v){ return v.replace(/\\n/gi, ' ').replace(/\\([,;\\])/g, '$1').trim(); };
    (text || '').replace(/\r?\n[ \t]/g, '').split(/\r?\n/).forEach(function(line){
      var i = line.indexOf(':');
      if(i < 1) return;
      var name = line.slice(0, i).split(';')[0].toUpperCase();
      var raw = line.slice(i + 1).trim();
      if(!raw) return;
      if(name === 'TEL'){
        // The app writes "TEL;CELL:+1" when the number wasn't shared.
        if(raw.replace(/\D/g, '').length >= 5) out.tels.push(unesc(raw));
      } else if(name === 'EMAIL'){
        if(raw.indexOf('@') > 0) out.emails.push(unesc(raw));
      } else if(name === 'URL'){
        out.urls.push(unesc(raw));
      } else if(name === 'ADR'){
        var parts = raw.split(';').slice(2).map(unesc).filter(Boolean);
        if(parts.length) out.adr = parts.join(', ');
      }
    });
    return out;
  }

  function prettyPhone(p){
    var d = p.replace(/\D/g, '');
    if(/^\+?1/.test(p) && d.length === 11) return '+1 (' + d.slice(1, 4) + ') ' + d.slice(4, 7) + '-' + d.slice(7);
    return p;
  }

  // Only web links become hrefs, so a pasted "javascript:" can never run.
  function safeURL(u){
    var withScheme = /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : 'https://' + u;
    try {
      var parsed = new URL(withScheme);
      return (parsed.protocol === 'https:' || parsed.protocol === 'http:') ? parsed.href : null;
    } catch(err){ return null; }
  }

  function row(kind, label, value, href, external){
    return '<li><a class="cc-row" href="' + esc(href) + '"' + (external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>' +
      '<span class="cc-ic">' + icon(kind) + '</span>' +
      '<span class="cc-txt"><small>' + esc(label) + '</small><span>' + esc(value) + '</span></span></a></li>';
  }

  var sheetEl = null, lastTrigger = null;

  function closeContactCard(){
    if(!sheetEl || sheetEl.hidden) return;
    sheetEl.classList.remove('open');
    document.documentElement.style.overflow = '';
    var el = sheetEl;
    setTimeout(function(){ el.hidden = true; }, 200);
    if(lastTrigger) lastTrigger.focus();
  }

  function openContactCard(p, trigger){
    lastTrigger = trigger;
    var c = parseVCard(p.vcard);
    var rows = '';
    c.tels.forEach(function(t){ rows += row('phone', 'Phone', prettyPhone(t), 'tel:' + t.replace(/[^\d+]/g, ''), false); });
    c.emails.forEach(function(e){ rows += row('mail', 'Email', e, 'mailto:' + e, false); });
    c.urls.forEach(function(u){
      var href = safeURL(u);
      if(href) rows += row('link', 'Link', u.replace(/^https?:\/\//i, '').replace(/\/$/, ''), href, true);
    });
    if(c.adr) rows += row('pin', 'Address', c.adr, 'https://maps.apple.com/?q=' + encodeURIComponent(c.adr), true);

    if(!sheetEl){
      sheetEl = document.createElement('div');
      sheetEl.className = 'sheet';
      sheetEl.hidden = true;
      document.body.appendChild(sheetEl);
      sheetEl.addEventListener('click', function(ev){
        if(ev.target.closest('[data-close]')) closeContactCard();
        var add = ev.target.closest('#ccAdd');
        if(add) saveContact(sheetEl.dataset.who, p.vcard, p.photo, add);
      });
      document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') closeContactCard(); });
    }
    sheetEl.dataset.who = p.who || '';
    sheetEl.innerHTML =
      '<div class="scrim" data-close></div>' +
      '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="ccName">' +
        '<div class="cc-head">' +
          '<button class="close" type="button" data-close aria-label="Close">' + icon('x') + '</button>' +
          '<span class="avatar" aria-hidden="true">' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : esc(p.initials)) + '</span>' +
          '<h2 id="ccName">' + esc(p.who || 'Contact') + '</h2>' +
          (p.role ? '<p>' + esc(p.role) + '</p>' : '') +
        '</div>' +
        (rows ? '<ul class="cc-rows">' + rows + '</ul>' : '') +
        '<button class="btn primary cc-add" id="ccAdd" type="button">Add to contacts</button>' +
      '</div>';
    sheetEl.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    // One frame at the start state, so the enter transition runs.
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      sheetEl.classList.add('open');
      sheetEl.querySelector('.close').focus();
    }); });
  }

  // The stored vCard carries no photo (the app keeps base64 out of vCards
  // because they also become QR codes). Contacts only saves a photo that is
  // embedded, never one behind a URL, so fetch it and inline it here. Adds
  // FN too: Android and Outlook refuse a card without it.
  function saveContact(who, vcard, photoURL, btn){
    var name = (who ? who.replace(/[^\w\- ]+/g, '').trim() : '') || 'contact';
    var text = vcard.replace(/\r?\n/g, '\r\n');
    if(who && !/^FN[:;]/m.test(text)) text = text.replace(/^(N[:;].*)$/m, '$1\r\nFN:' + who.replace(/[\r\n]/g, ' '));
    var done = function(t){ saveBlob(new Blob([t], { type: 'text/vcard;charset=utf-8' }), name + '.vcf'); };
    if(!photoURL || /^PHOTO[:;]/m.test(text)){ done(text); return; }
    if(btn) btn.disabled = true;
    fetch(WORKER + '/asset?url=' + encodeURIComponent(photoURL))
      .then(function(r){ if(!r.ok) throw new Error('photo ' + r.status); return r.blob(); })
      .then(shrinkPhoto)
      .then(function(blob){
        return new Promise(function(res, rej){
          var fr = new FileReader();
          fr.onload = function(){ res(String(fr.result).split(',')[1] || ''); };
          fr.onerror = rej;
          fr.readAsDataURL(blob);
        });
      })
      .then(function(b64){
        if(!b64){ done(text); return; }
        // RFC 2425 folding: 75-character lines, continuations start with a space.
        var line = 'PHOTO;ENCODING=b;TYPE=JPEG:' + b64, folded = line.slice(0, 75);
        for(var i = 75; i < line.length; i += 74) folded += '\r\n ' + line.slice(i, i + 74);
        done(text.replace(/END:VCARD\s*$/, folded + '\r\nEND:VCARD\r\n'));
      })
      .catch(function(){ done(text); })
      .then(function(){ if(btn) btn.disabled = false; });
  }

  // Contacts shows photos small; 256 px keeps the .vcf around 20 KB instead of
  // carrying a full-resolution portrait. Falls back to the original blob.
  function shrinkPhoto(blob){
    if(!window.createImageBitmap) return blob;
    return createImageBitmap(blob).then(function(bmp){
      var side = 256, scale = Math.min(1, side / Math.max(bmp.width, bmp.height));
      var c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale);
      c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return new Promise(function(res){ c.toBlob(function(b){ res(b || blob); }, 'image/jpeg', 0.85); });
    }).catch(function(){ return blob; });
  }

  function saveBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
})();
</script>
</body>
</html>
